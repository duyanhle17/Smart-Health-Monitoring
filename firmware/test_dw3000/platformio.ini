; DWM3000 <-> ESP32-S3 test project (standalone)
;
;  1 module (check it works):   pio run -e check      -t upload  &&  pio device monitor
;  2 modules (ranging, later):  pio run -e responder  -t upload   (board A)
;                               pio run -e initiator  -t upload   (board B)
;
; The Dw3000 library is shared from ../lib (lib_extra_dirs) - nothing to copy.

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.mcu = esp32s3
board_build.psram = enable
; default: build only main.cpp (env:idf overrides to build idf_test.cpp instead)
build_src_filter = -<*> +<main.cpp>
; --- auto-run the app after flashing over native USB (USB-Serial/JTAG):
;     watchdog_reset re-samples the GPIO0 strap so no manual RESET press is needed ---
board_upload.after_reset = watchdog_reset
; share the vendored Dw3000 library in ../lib
lib_extra_dirs = ../lib
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; DW3000 pins (override library defaults)
    -DDW3000_PIN_RST=17
    -DDW3000_PIN_IRQ=18
    -DDW3000_PIN_CS=10
    -DDW3000_PIN_SCK=12
    -DDW3000_PIN_MOSI=11
    -DDW3000_PIN_MISO=13

; --- 1 module: is the DWM3000 alive & SPI wired right? (reads DEV_ID) ---
[env:check]
build_flags = ${env.build_flags} -DTEST_CHECK

; --- ESP-IDF spi_master two-phase half-duplex fix (OLD pins 11/9/12) ---
;     compiles ONLY src/idf_test.cpp (standalone, no dw3000.h / no Arduino SPI)
[env:idf]
build_src_filter = -<*> +<idf_test.cpp>
build_flags = ${env.build_flags}

; --- hardware check: I2C scan + DWM3000 DEV_ID (native-USB board) ---
[env:hwcheck]
build_src_filter = -<*> +<hwcheck.cpp>
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; --- TAG test: DWM3000 (SPI) + BNO08x (I2C) cung luc ---
;     uwbimu  = board USB goc (native-USB, 303A:1001)
;     uwbimuu = board dung CH343 (1A86:55D3) -> Serial ra UART0
[env:uwbimu]
build_src_filter = -<*> +<uwb_imu_test.cpp>
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps = sparkfun/SparkFun BNO08x Cortex Based IMU@^1.0.6

[env:uwbimuu]
build_src_filter = -<*> +<uwb_imu_test.cpp>
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps = sparkfun/SparkFun BNO08x Cortex Based IMU@^1.0.6

; --- test 2 cam bien MAX (30102 nhip tim + 30205 nhiet do) ---
[env:maxtest]
build_src_filter = -<*> +<max_test.cpp>
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps = sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2

[env:maxtestu]
build_src_filter = -<*> +<max_test.cpp>
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps = sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2

; --- NEW-wiring board with CH343 USB-UART bridge (usbmodem5C37...) ---
;     Serial goes out UART0 (not native USB), so NO ARDUINO_USB_CDC_ON_BOOT.
;     IOMUX pins SCK=12 MOSI=11 MISO=13 CS=10. Reads DEV_ID (env check logic).
[env:checku]
build_src_filter = -<*> +<main.cpp>
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DDW3000_PIN_RST=17
    -DDW3000_PIN_IRQ=18
    -DDW3000_PIN_CS=10
    -DDW3000_PIN_SCK=12
    -DDW3000_PIN_MOSI=11
    -DDW3000_PIN_MISO=13
    -DTEST_CHECK

; --- 2 modules: single-sided two-way ranging ---
[env:initiator]
build_flags = ${env.build_flags} -DTEST_INITIATOR

[env:responder]
build_flags = ${env.build_flags} -DTEST_RESPONDER

; --- init + ranging on the CH343 new-wiring board (Serial via UART0) ---
[env:initu]
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DDW3000_PIN_RST=17
    -DDW3000_PIN_IRQ=18
    -DDW3000_PIN_CS=10
    -DDW3000_PIN_SCK=12
    -DDW3000_PIN_MOSI=11
    -DDW3000_PIN_MISO=13
    -DTEST_INITIATOR

[env:responderu]
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DDW3000_PIN_RST=17
    -DDW3000_PIN_IRQ=18
    -DDW3000_PIN_CS=10
    -DDW3000_PIN_SCK=12
    -DDW3000_PIN_MOSI=11
    -DDW3000_PIN_MISO=13
    -DTEST_RESPONDER
