; SafeWork firmware - build one of the environments below.
;   pio run -e tag      -t upload      (worker helmet)
;   pio run -e anchor1  -t upload      (anchor #1)
;   pio run -e anchor2  -t upload      (anchor #2)
;
; Boards come in two flavours and they need DIFFERENT serial flags:
;   *  native USB (303A:1001)   -> env:tag  / anchor1  / anchor2
;   *  CH343 USB-UART (1A86:*)  -> env:tagu / anchor1u / anchor2u  (Serial via UART0)
; Flashing a CH343 board with CDC_ON_BOOT=1 leaves you with a silent monitor.
;
; The DW3000 driver (Makerfabs "Dw3000") is vendored in lib/Dw3000/ and its SPI
; runs at 2 MHz (see lib/Dw3000/src/dw3000_port.cpp) - the turnaround timings in
; src/uwb.cpp assume that. Pins below are the FSPI IOMUX set, matching config.h.

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.psram = enable
; re-sample the GPIO0 strap after flashing so the app runs without a manual RESET
board_upload.after_reset = watchdog_reset
build_flags =
    ; DW3000 pins (override the Makerfabs library defaults) - match config.h
    -DDW3000_PIN_RST=17
    -DDW3000_PIN_IRQ=18
    -DDW3000_PIN_CS=10
    -DDW3000_PIN_SCK=12
    -DDW3000_PIN_MOSI=11
    -DDW3000_PIN_MISO=13
lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2
    sparkfun/SparkFun BNO08x Cortex Based IMU@^1.0.6

; Serial transport, picked per board (see header)
[usb]
native = -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1
ch343  = -DARDUINO_USB_CDC_ON_BOOT=0

; ---- Worker / Tag: initiator + sensors + WiFi telemetry ----
[env:tag]
build_flags = ${env.build_flags} ${usb.native} -DROLE_TAG

[env:tagu]
build_flags = ${env.build_flags} ${usb.ch343} -DROLE_TAG

; ---- Anchors: pure UWB responders (sensor libs unused, but harmless) ----
[env:anchor1]
build_flags = ${env.build_flags} ${usb.native} -DROLE_ANCHOR -DANCHOR_ID=1

[env:anchor1u]
build_flags = ${env.build_flags} ${usb.ch343} -DROLE_ANCHOR -DANCHOR_ID=1

[env:anchor2]
build_flags = ${env.build_flags} ${usb.native} -DROLE_ANCHOR -DANCHOR_ID=2

[env:anchor2u]
build_flags = ${env.build_flags} ${usb.ch343} -DROLE_ANCHOR -DANCHOR_ID=2
