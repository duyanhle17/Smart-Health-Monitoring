# Deploy SafeWork dashboard -> safework.ctslab.net (Cloudflare tunnel -> localhost:6868)
# Frontend (Vite) la diem vao duy nhat, proxy /api + /socket.io sang backend noi bo.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: safework_backend
    environment:
      - PORT=5000
      # SQLite noi bo, khong can MySQL cho demo
      - DATABASE_URL=sqlite:////app/data/local.db
      - SAFEWORK_DATA_DIR=/app/data
      # Set these in the server .env after measuring antenna phase centres.
      - ANCHOR_BASELINE_M=${ANCHOR_BASELINE_M:-6.0}
      - UWB_D1_OFFSET_M=${UWB_D1_OFFSET_M:-0.0}
      - UWB_D2_OFFSET_M=${UWB_D2_OFFSET_M:-0.0}
      - WORK_AREA_POINT=${WORK_AREA_POINT:-50,70}
      - UWB_CALIBRATED=${UWB_CALIBRATED:-false}
      - UWB_FIX_HOLD_SECONDS=${UWB_FIX_HOLD_SECONDS:-15.0}
      - UWB_LAST_KNOWN_VISIBLE_SECONDS=${UWB_LAST_KNOWN_VISIBLE_SECONDS:-60.0}
      # Only for a worker physically constrained to the exact A1-A2 line.
      # This is labelled 1-D in the dashboard; it is never a 2-D fallback.
      - UWB_LINE_FALLBACK=${UWB_LINE_FALLBACK:-false}
      - UWB_LINE_FALLBACK_TOLERANCE_M=${UWB_LINE_FALLBACK_TOLERANCE_M:-0.35}
      # Optional IMU continuity prior. Keep disabled until heading + stride are
      # measured against the A1→A2 axis; it never substitutes for UWB.
      - UWB_IMU_FUSION=${UWB_IMU_FUSION:-false}
      - IMU_STRIDE_M=${IMU_STRIDE_M:-0.0}
      - IMU_YAW_A1_TO_A2_DEG=${IMU_YAW_A1_TO_A2_DEG:-}
      - IMU_FORWARD_OFFSET_DEG=${IMU_FORWARD_OFFSET_DEG:-0.0}
      - IMU_YAW_SIGN=${IMU_YAW_SIGN:-1.0}
      - UWB_BRANCH_MIN_HEIGHT_M=${UWB_BRANCH_MIN_HEIGHT_M:-0.25}
      - UWB_MAX_STEP_DELTA=${UWB_MAX_STEP_DELTA:-4}
      - SAFEWORK_ALLOW_SIMULATOR=${SAFEWORK_ALLOW_SIMULATOR:-false}
    volumes:
      - safework_db:/app/data
    expose:
      - "5000"
    restart: unless-stopped

  simulator:
    build:
      context: .
      dockerfile: backend/Dockerfile.simulator
    container_name: safework_simulator
    environment:
      - BACKEND_URL=http://backend:5000
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: safework_frontend
    ports:
      - "6868:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  safework_db:
